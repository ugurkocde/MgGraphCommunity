<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="MgGraphCommunity — Community drop-in for Connect-MgGraph. No WAM. No SDK black box.">
  <title>MgGraphCommunity</title>
  <desc>Community drop-in for Connect-MgGraph. No WAM. No SDK black box.</desc>

  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#012456"/>
      <stop offset="60%" stop-color="#0a1b3d"/>
      <stop offset="100%" stop-color="#050b1e"/>
    </linearGradient>

    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7fd6ff"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a3370" stroke-width="0.5" opacity="0.45"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- Soft accent glow -->
  <circle cx="1040" cy="80" r="180" fill="#1f7fcf" opacity="0.12"/>
  <circle cx="160" cy="280" r="160" fill="#00d4ff" opacity="0.08"/>

  <!-- Left side: title block -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, system-ui, sans-serif">
    <!-- Eyebrow / community badge -->
    <g transform="translate(60, 70)">
      <rect x="0" y="0" width="148" height="26" rx="13" fill="none" stroke="#7fd6ff" stroke-width="1" opacity="0.7"/>
      <text x="74" y="18" font-size="13" font-weight="600" fill="#7fd6ff" text-anchor="middle" letter-spacing="1.6">COMMUNITY MODULE</text>
    </g>

    <!-- Title -->
    <text x="60" y="170" font-size="68" font-weight="800" fill="url(#title)" letter-spacing="-1.5" filter="url(#glow)">MgGraphCommunity</text>

    <!-- Tagline -->
    <text x="60" y="212" font-size="22" fill="#c8d6ec" font-weight="500">A drop-in for Connect-MgGraph.</text>
    <text x="60" y="242" font-size="22" fill="#c8d6ec" font-weight="500">No WAM. No MSAL. No SDK black box.</text>

    <!-- Feature pills -->
    <g transform="translate(60, 268)" font-size="13" font-weight="600" fill="#9bb4d4">
      <g>
        <rect x="0" y="0" width="106" height="28" rx="14" fill="#0e2452" stroke="#264a8b" stroke-width="1"/>
        <text x="53" y="19" text-anchor="middle">PKCE + LOOPBACK</text>
      </g>
      <g transform="translate(118, 0)">
        <rect x="0" y="0" width="124" height="28" rx="14" fill="#0e2452" stroke="#264a8b" stroke-width="1"/>
        <text x="62" y="19" text-anchor="middle">PURE POWERSHELL</text>
      </g>
      <g transform="translate(254, 0)">
        <rect x="0" y="0" width="138" height="28" rx="14" fill="#0e2452" stroke="#264a8b" stroke-width="1"/>
        <text x="69" y="19" text-anchor="middle">IN-MEMORY BY DEFAULT</text>
      </g>
    </g>
  </g>

  <!-- Right side: terminal mock -->
  <g transform="translate(770, 70)">
    <!-- Window chrome -->
    <rect x="0" y="0" width="450" height="200" rx="10" fill="#0a1430" stroke="#2c4a85" stroke-width="1"/>
    <rect x="0" y="0" width="450" height="32" rx="10" fill="#16244a"/>
    <rect x="0" y="22" width="450" height="10" fill="#16244a"/>
    <circle cx="18" cy="16" r="5" fill="#ff5f57"/>
    <circle cx="36" cy="16" r="5" fill="#febc2e"/>
    <circle cx="54" cy="16" r="5" fill="#28c840"/>
    <text x="225" y="20" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#7889b6" text-anchor="middle">PowerShell 7</text>

    <!-- Terminal content -->
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">
      <!-- prompt 1 -->
      <text x="20" y="62"  fill="#7fd6ff">PS</text>
      <text x="42" y="62"  fill="#9bb4d4">&gt;</text>
      <text x="56" y="62"  fill="#ffffff">Connect-MgGraphCommunity</text>

      <!-- output -->
      <text x="20" y="86"  fill="#9bd680">Opening browser for sign-in...</text>
      <text x="20" y="106" fill="#9bd680">Welcome To MgGraphCommunity!</text>
      <text x="20" y="124" fill="#c8d6ec">  Account     : admin@contoso.com</text>
      <text x="20" y="142" fill="#c8d6ec">  Environment : Global</text>
      <text x="20" y="160" fill="#c8d6ec">  AuthType    : Interactive</text>

      <!-- prompt 2 with cursor -->
      <text x="20" y="184" fill="#7fd6ff">PS</text>
      <text x="42" y="184" fill="#9bb4d4">&gt;</text>
      <rect x="56" y="172" width="8" height="14" fill="#7fd6ff">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
